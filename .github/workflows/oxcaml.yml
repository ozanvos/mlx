name: OxCaml

on:
  workflow_dispatch:
  push:
    branches: [codex/oxcaml-compat]

permissions:
  contents: read

jobs:
  native:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: ocaml/setup-ocaml@v3
        with:
          ocaml-compiler: oxcaml-compiler.5.2.0minus40
          opam-repositories: |
            ox: https://github.com/oxcaml/opam-repository.git#9d3f5b0c2ce343683e003157fdd3a01124fecc2b
            default: https://github.com/ocaml/opam-repository.git
      - run: opam install ./mlx-oxcaml.opam --deps-only --with-test --yes
      - run: opam exec -- dune build -p mlx-oxcaml @install
      - run: opam exec -- dune runtest oxcaml/test -p mlx-oxcaml
      - run: opam lint mlx-oxcaml.opam
      - run: opam install ./mlx-oxcaml.opam --yes
      - run: opam exec -- dune exec --root oxcaml/example ./main.exe
